apiVersion: apps/v1
# tells kubernetes to manage this deployment 
kind: Deployment

metadata:
  name: chaos-canary

spec:
# should always keep 2 pods alive for backup 
  replicas: 2

  selector:
    matchLabels:
      app: chaos-canary

  template: 
    metadata:
# tells server to look for pods named chaos-canary kinda like hashtags 
      labels:
        app: chaos-canary
        version: v1

    spec:
      containers:
      - name: chaos-canary
        # use our docker image 
        image: chaos-canary:devv
# we are using local image so there is no need to pull image from docker hub 
        imagePullPolicy: Never
        env: 
        - name: APP_NAME
          valueFrom:
            configMapKeyRef:
              name: chaos-canary-config-v1 
              key: APP_NAME

        - name: APP_VERSION
          valueFrom:
            configMapKeyRef:
              name: chaos-canary-config-v1
              key: APP_VERSION
        - name: ENVIRONMENT
          valueFrom: 
            configMapKeyRef:
              name: chaos-canary-config-v1
              key: ENVIRONMENT          

        ports:
        - containerPort: 8000

        # readiness probe 
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 2
          successThreshold: 1
          failureThreshold: 3
        # Liveness Probe 
        livenessProbe:
          httpGet: 
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
