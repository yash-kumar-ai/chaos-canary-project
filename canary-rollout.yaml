apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: payment-rollout
spec:
  replicas: 5 # We want 5 pods running our app
  strategy:
    canary:
      # Tell Argo to use Nginx to split the network traffic
      trafficRouting:
        nginx:
          stableIngress: payment-ingress
      steps:
      - setWeight: 5 # Step 1: Route exactly 5% of traffic to the new version
      - pause: {}    # Step 2: Pause indefinitely until we manually tell it to proceed
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-api
        image: payment-service:1.0.0 # Starting with version 1
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: APP_VERSION
          value: "1.0.0"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-stable
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: payment-service
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service-canary
spec:
  ports:
  - port: 8080
    targetPort: 8080
  selector:
    app: payment-service
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: payment-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: payment-service-stable
            port:
              number: 8080